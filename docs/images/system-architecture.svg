<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">HermesGraph system architecture</title>
  <desc id="desc">Architecture showing the workbench, Hermes runtime, capability bridge, retrieval, knowledge and learning services.</desc>
  <style>
    .bg { fill: #f7f8f7; }
    .panel { fill: #ffffff; stroke: #d9dedb; stroke-width: 2; }
    .runtime { fill: #173d31; stroke: #173d31; stroke-width: 2; }
    .accent { fill: #e8f2ed; stroke: #8bb6a4; stroke-width: 2; }
    .store { fill: #fff8e8; stroke: #ddb868; stroke-width: 2; }
    .control { fill: #fcefeb; stroke: #d89885; stroke-width: 2; }
    .title { font: 700 28px Inter, Arial, sans-serif; fill: #17201c; }
    .section { font: 700 15px Inter, Arial, sans-serif; fill: #64716b; letter-spacing: 1px; }
    .label { font: 700 18px Inter, Arial, sans-serif; fill: #17201c; }
    .body { font: 400 14px Inter, Arial, sans-serif; fill: #52605a; }
    .inverse { fill: #ffffff; }
    .line { stroke: #7f8b85; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .softline { stroke: #a9b2ad; stroke-width: 2; fill: none; stroke-dasharray: 7 7; marker-end: url(#arrowSoft); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8b85"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9b2ad"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="820" rx="12"/>
  <text class="title" x="64" y="62">HermesGraph system architecture</text>
  <text class="body" x="64" y="90">One agent loop, governed tools, evidence-first retrieval, and durable learning.</text>

  <text class="section" x="70" y="145">EXPERIENCE</text>
  <rect class="panel" x="60" y="165" width="230" height="125" rx="8"/>
  <text class="label" x="88" y="207">React Workbench</text>
  <text class="body" x="88" y="237">Chat and run timeline</text>
  <text class="body" x="88" y="262">Knowledge, graph, memory</text>

  <text class="section" x="375" y="145">AGENT RUNTIME</text>
  <rect class="runtime" x="360" y="165" width="320" height="125" rx="8"/>
  <text class="label inverse" x="390" y="207">Hermes Agent 0.19</text>
  <text class="body inverse" x="390" y="237">Only online agent loop</text>
  <text class="body inverse" x="390" y="262">Adaptive-RAG + Context Engine</text>

  <text class="section" x="765" y="145">CONTROL BOUNDARY</text>
  <rect class="accent" x="750" y="165" width="320" height="125" rx="8"/>
  <text class="label" x="780" y="207">Capability Bridge</text>
  <text class="body" x="780" y="237">Scope, schema, timeout, budget</text>
  <text class="body" x="780" y="262">Evidence allowlist and audit</text>

  <text class="section" x="1160" y="145">MODEL</text>
  <rect class="panel" x="1145" y="165" width="235" height="125" rx="8"/>
  <text class="label" x="1173" y="207">OpenAI SDK</text>
  <text class="body" x="1173" y="237">Responses and tools</text>
  <text class="body" x="1173" y="262">Vision and embeddings</text>

  <path class="line" d="M290 228 H348"/>
  <path class="line" d="M680 228 H738"/>
  <path class="line" d="M1070 228 H1133"/>

  <text class="section" x="70" y="375">AGENTIC RETRIEVAL AND TOOLS</text>
  <rect class="panel" x="60" y="395" width="270" height="130" rx="8"/>
  <text class="label" x="88" y="437">LangChain LCEL</text>
  <text class="body" x="88" y="467">Parallel retrieval and RRF</text>
  <text class="body" x="88" y="492">Adapters and callbacks</text>

  <rect class="accent" x="370" y="395" width="270" height="130" rx="8"/>
  <text class="label" x="398" y="437">Retrieval Controller</text>
  <text class="body" x="398" y="467">Up to 4 subqueries / 2 rounds</text>
  <text class="body" x="398" y="492">Conditional Self-RAG</text>

  <rect class="panel" x="680" y="395" width="270" height="130" rx="8"/>
  <text class="label" x="708" y="437">General Tools</text>
  <text class="body" x="708" y="467">Web search and page read</text>
  <text class="body" x="708" y="492">Calculator, time, workspace</text>

  <rect class="control" x="990" y="395" width="390" height="130" rx="8"/>
  <text class="label" x="1018" y="437">Strict Answer Publisher</text>
  <text class="body" x="1018" y="467">Claims reference run-local evidence only</text>
  <text class="body" x="1018" y="492">No fabricated sources or graph paths</text>

  <path class="line" d="M910 290 V342 H195 V383"/>
  <path class="line" d="M330 460 H358"/>
  <path class="line" d="M640 460 H668"/>
  <path class="line" d="M950 460 H978"/>

  <text class="section" x="70" y="610">KNOWLEDGE AND STATE</text>
  <rect class="store" x="60" y="630" width="235" height="120" rx="8"/>
  <text class="label" x="88" y="672">Qdrant</text>
  <text class="body" x="88" y="702">Dense + sparse + BM25</text>
  <text class="body" x="88" y="727">Server-side RRF</text>

  <rect class="store" x="330" y="630" width="235" height="120" rx="8"/>
  <text class="label" x="358" y="672">Neo4j</text>
  <text class="body" x="358" y="702">Evidence-backed graph</text>
  <text class="body" x="358" y="727">Allowlisted traversal</text>

  <rect class="store" x="600" y="630" width="235" height="120" rx="8"/>
  <text class="label" x="628" y="672">PostgreSQL</text>
  <text class="body" x="628" y="702">Durable jobs and metadata</text>
  <text class="body" x="628" y="727">Audit and transition ledger</text>

  <rect class="accent" x="870" y="630" width="235" height="120" rx="8"/>
  <text class="label" x="898" y="672">Memory and Skills</text>
  <text class="body" x="898" y="702">Versioned, scoped assets</text>
  <text class="body" x="898" y="727">Shadow / canary activation</text>

  <rect class="panel" x="1140" y="630" width="240" height="120" rx="8"/>
  <text class="label" x="1168" y="672">Document Pipeline</text>
  <text class="body" x="1168" y="702">IR, OCR, token chunks</text>
  <text class="body" x="1168" y="727">PDF, image, Office, text</text>

  <path class="softline" d="M505 525 V575 H178 V618"/>
  <path class="softline" d="M505 525 V575 H448 V618"/>
  <path class="softline" d="M815 525 V575 H718 V618"/>
  <path class="softline" d="M1185 525 V575 H988 V618"/>
  <path class="softline" d="M1260 618 V555 H815 V537"/>
</svg>
