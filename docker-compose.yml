name: hermesgraph

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: "${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
      hermes:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_NAME: hermesgraph
      DATA_DIR: /data
      API_AUTH_MODE: "${API_AUTH_MODE:-local}"
      API_BEARER_TOKEN: "${API_BEARER_TOKEN:-}"
      API_TENANT_ID: "${API_TENANT_ID:-local}"
      API_USER_ID: "${API_USER_ID:-local-user}"
      API_ALLOWED_PROJECTS: '${API_ALLOWED_PROJECTS:-[]}'
      API_IDENTITY_ROLE: "${API_IDENTITY_ROLE:-owner}"
      RUNTIME_MODE: "${RUNTIME_MODE:-hermes}"
      HERMES_API_URL: http://hermes:8642
      HERMES_API_KEY: "${HERMES_API_KEY:-hermesgraph-local-api-key-change-me-0001}"
      HERMES_BRIDGE_TOKEN: "${HERMES_BRIDGE_TOKEN:-hermesgraph-local-bridge-change-me-0001}"
      HERMES_NATIVE_ADMIN_URL: http://hermes:8643
      HERMES_NATIVE_ADMIN_TOKEN: "${HERMES_NATIVE_ADMIN_TOKEN:-hermesgraph-local-native-admin-change-me-0001}"
      HERMES_NATIVE_ADMIN_TIMEOUT_SECONDS: "${HERMES_NATIVE_ADMIN_TIMEOUT_SECONDS:-10}"
      HERMES_NATIVE_SNAPSHOT_RETENTION_DAYS: "${HERMES_NATIVE_SNAPSHOT_RETENTION_DAYS:-30}"
      HERMES_POLL_INTERVAL_SECONDS: "${HERMES_POLL_INTERVAL_SECONDS:-0.25}"
      HERMES_POST_PUBLISH_TIMEOUT_SECONDS: "${HERMES_POST_PUBLISH_TIMEOUT_SECONDS:-120}"
      HERMES_NATIVE_REVIEW_TIMEOUT_SECONDS: "${HERMES_NATIVE_REVIEW_TIMEOUT_SECONDS:-180}"
      HERMES_SHUTDOWN_GRACE_SECONDS: "${HERMES_SHUTDOWN_GRACE_SECONDS:-10}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.6}"
      MODEL_PROVIDER: "${MODEL_PROVIDER:-openai}"
      MODEL_BASE_URL: "${DOCKER_MODEL_BASE_URL:-}"
      MODEL_API_KEY: "${MODEL_API_KEY:-}"
      LEARNING_MODE: "${LEARNING_MODE:-shadow}"
      LEARNING_REFLECTOR_MODE: "${LEARNING_REFLECTOR_MODE:-deterministic}"
      LEARNING_REFLECTION_MODEL: "${LEARNING_REFLECTION_MODEL:-gpt-5.6}"
      LEARNING_REFLECTION_MAX_OUTPUT_TOKENS: "${LEARNING_REFLECTION_MAX_OUTPUT_TOKENS:-2000}"
      LEARNING_REFLECTION_TIMEOUT_SECONDS: "${LEARNING_REFLECTION_TIMEOUT_SECONDS:-45}"
      LEARNING_REFLECTION_MAX_INPUT_CHARS: "${LEARNING_REFLECTION_MAX_INPUT_CHARS:-20000}"
      LEARNING_REFLECTION_MIN_MEMORY_CONFIDENCE: "${LEARNING_REFLECTION_MIN_MEMORY_CONFIDENCE:-0.75}"
      LEARNING_REFLECTION_TRIGGER_MODE: "${LEARNING_REFLECTION_TRIGGER_MODE:-signals}"
      HARNESS_EXPERIENCE_ENABLED: "${HARNESS_EXPERIENCE_ENABLED:-true}"
      HARNESS_DISTILLATION_ENABLED: "${HARNESS_DISTILLATION_ENABLED:-true}"
      HARNESS_OVERLAY_MODE: "${HARNESS_OVERLAY_MODE:-observe}"
      HARNESS_EXPERIENCE_TTL_DAYS: "${HARNESS_EXPERIENCE_TTL_DAYS:-180}"
      HARNESS_MIN_CLUSTER_SIZE: "${HARNESS_MIN_CLUSTER_SIZE:-5}"
      HARNESS_REPEATED_FAILURE_THRESHOLD: "${HARNESS_REPEATED_FAILURE_THRESHOLD:-3}"
      HARNESS_MAX_PATTERNS_PER_RUN: "${HARNESS_MAX_PATTERNS_PER_RUN:-3}"
      HARNESS_BOUNDED_CONSUMER_ENABLED: "${HARNESS_BOUNDED_CONSUMER_ENABLED:-true}"
      HARNESS_CANARY_PERCENTAGE: "${HARNESS_CANARY_PERCENTAGE:-10}"
      HARNESS_MAX_CAPSULE_MEMORIES: "${HARNESS_MAX_CAPSULE_MEMORIES:-20}"
      HARNESS_MAX_GRAPH_HOPS: "${HARNESS_MAX_GRAPH_HOPS:-3}"
      HARNESS_MAX_SUBQUERIES: "${HARNESS_MAX_SUBQUERIES:-4}"
      HARNESS_MAX_RETRIEVAL_ROUNDS: "${HARNESS_MAX_RETRIEVAL_ROUNDS:-2}"
      SKILL_MIN_EVALUATION_CASES: "${SKILL_MIN_EVALUATION_CASES:-2}"
      SKILL_REPLAY_TIMEOUT_SECONDS: "${SKILL_REPLAY_TIMEOUT_SECONDS:-5.0}"
      SKILL_REPLAY_MAX_STEPS: "${SKILL_REPLAY_MAX_STEPS:-20}"
      SKILL_REFINEMENT_MIN_NEW_RUNS: "${SKILL_REFINEMENT_MIN_NEW_RUNS:-2}"
      SKILL_MIN_SHADOW_OBSERVATIONS: "${SKILL_MIN_SHADOW_OBSERVATIONS:-3}"
      SKILL_MIN_CANARY_OBSERVATIONS: "${SKILL_MIN_CANARY_OBSERVATIONS:-5}"
      SKILL_MIN_QUALITY_SCORE: "${SKILL_MIN_QUALITY_SCORE:-0.65}"
      SKILL_MAX_SCORE_REGRESSION: "${SKILL_MAX_SCORE_REGRESSION:-0.02}"
      SKILL_MAX_FAILURE_RATE: "${SKILL_MAX_FAILURE_RATE:-0.20}"
      SKILL_MAX_UNSUPPORTED_CLAIM_RATE: "${SKILL_MAX_UNSUPPORTED_CLAIM_RATE:-0.05}"
      SKILL_MAX_NEGATIVE_FEEDBACK_RATE: "${SKILL_MAX_NEGATIVE_FEEDBACK_RATE:-0.0}"
      SKILL_SEVERE_NEGATIVE_FEEDBACK_THRESHOLD: "${SKILL_SEVERE_NEGATIVE_FEEDBACK_THRESHOLD:--0.5}"
      MAX_RETRIEVAL_TOOL_CALLS: "${MAX_RETRIEVAL_TOOL_CALLS:-3}"
      MAX_GRAPH_TOOL_CALLS: "${MAX_GRAPH_TOOL_CALLS:-6}"
      MAX_WEB_SEARCH_TOOL_CALLS: "${MAX_WEB_SEARCH_TOOL_CALLS:-3}"
      MAX_COMPUTER_TOOL_CALLS: "${MAX_COMPUTER_TOOL_CALLS:-8}"
      MAX_PERSONAL_TOOL_CALLS: "${MAX_PERSONAL_TOOL_CALLS:-8}"
      MAX_SKILL_ACTIVATIONS: "${MAX_SKILL_ACTIVATIONS:-3}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-20000000}"
      CONVERSATION_FAST_PATH_ENABLED: "${CONVERSATION_FAST_PATH_ENABLED:-true}"
      CONVERSATION_FAST_PATH_TIMEOUT_SECONDS: "${CONVERSATION_FAST_PATH_TIMEOUT_SECONDS:-20}"
      CONVERSATION_FAST_PATH_MODEL: "${CONVERSATION_FAST_PATH_MODEL:-}"
      ADAPTIVE_RAG_ROUTER_ENABLED: "${ADAPTIVE_RAG_ROUTER_ENABLED:-true}"
      ADAPTIVE_RAG_ROUTER_TIMEOUT_SECONDS: "${ADAPTIVE_RAG_ROUTER_TIMEOUT_SECONDS:-12}"
      ADAPTIVE_RAG_ROUTER_MODEL: "${ADAPTIVE_RAG_ROUTER_MODEL:-}"
      CONVERSATION_HISTORY_TURNS: "${CONVERSATION_HISTORY_TURNS:-8}"
      CONTEXT_TOTAL_TOKENS: "${CONTEXT_TOTAL_TOKENS:-8000}"
      CONTEXT_HISTORY_TOKENS: "${CONTEXT_HISTORY_TOKENS:-3500}"
      CONTEXT_SUMMARY_TOKENS: "${CONTEXT_SUMMARY_TOKENS:-1200}"
      CONTEXT_MEMORY_TOKENS: "${CONTEXT_MEMORY_TOKENS:-2200}"
      CONTEXT_SKILL_TOKENS: "${CONTEXT_SKILL_TOKENS:-700}"
      CONTEXT_PERSONAL_TOKENS: "${CONTEXT_PERSONAL_TOKENS:-1200}"
      CONTEXT_MEMORY_RECENCY_HALF_LIFE_DAYS: "${CONTEXT_MEMORY_RECENCY_HALF_LIFE_DAYS:-90}"
      KNOWLEDGE_REPOSITORY_BACKEND: "${KNOWLEDGE_REPOSITORY_BACKEND:-postgres}"
      INGESTION_MODE: "${INGESTION_MODE:-async}"
      INGESTION_WORKER_ENABLED: "${INGESTION_WORKER_ENABLED:-true}"
      INGESTION_JOB_MAX_ATTEMPTS: "${INGESTION_JOB_MAX_ATTEMPTS:-3}"
      INGESTION_JOB_LEASE_SECONDS: "${INGESTION_JOB_LEASE_SECONDS:-300}"
      INGESTION_JOB_POLL_SECONDS: "${INGESTION_JOB_POLL_SECONDS:-1.0}"
      INGESTION_JOB_RETRY_BASE_SECONDS: "${INGESTION_JOB_RETRY_BASE_SECONDS:-5}"
      LEARNING_JOB_MODE: "${LEARNING_JOB_MODE:-async}"
      LEARNING_ARTIFACT_BACKEND: "${LEARNING_ARTIFACT_BACKEND:-postgres}"
      LEARNING_JOB_WORKER_ENABLED: "${LEARNING_JOB_WORKER_ENABLED:-true}"
      LEARNING_JOB_MAX_ATTEMPTS: "${LEARNING_JOB_MAX_ATTEMPTS:-3}"
      LEARNING_JOB_LEASE_SECONDS: "${LEARNING_JOB_LEASE_SECONDS:-300}"
      LEARNING_JOB_POLL_SECONDS: "${LEARNING_JOB_POLL_SECONDS:-1.0}"
      LEARNING_JOB_RETRY_BASE_SECONDS: "${LEARNING_JOB_RETRY_BASE_SECONDS:-5}"
      OUTBOX_DISPATCHER_ENABLED: "${OUTBOX_DISPATCHER_ENABLED:-true}"
      OUTBOX_LEASE_SECONDS: "${OUTBOX_LEASE_SECONDS:-60}"
      OUTBOX_POLL_SECONDS: "${OUTBOX_POLL_SECONDS:-0.5}"
      OUTBOX_RETRY_BASE_SECONDS: "${OUTBOX_RETRY_BASE_SECONDS:-2}"
      VISION_ENABLED: "${VISION_ENABLED:-false}"
      VISION_MODEL: "${VISION_MODEL:-gpt-5.6}"
      VISION_DETAIL: "${VISION_DETAIL:-high}"
      VISION_MAX_OUTPUT_TOKENS: "${VISION_MAX_OUTPUT_TOKENS:-4000}"
      VISION_MAX_PIXELS: "${VISION_MAX_PIXELS:-40000000}"
      VISION_MAX_DIMENSION: "${VISION_MAX_DIMENSION:-12000}"
      VISION_MAX_REGIONS: "${VISION_MAX_REGIONS:-40}"
      WEB_SEARCH_MODE: "${WEB_SEARCH_MODE:-disabled}"
      WEB_SEARCH_MODEL: "${WEB_SEARCH_MODEL:-gpt-5.6}"
      WEB_SEARCH_CONTEXT_SIZE: "${WEB_SEARCH_CONTEXT_SIZE:-medium}"
      WEB_SEARCH_MAX_RESULTS: "${WEB_SEARCH_MAX_RESULTS:-8}"
      WEB_SEARCH_MAX_OUTPUT_TOKENS: "${WEB_SEARCH_MAX_OUTPUT_TOKENS:-3000}"
      WEB_SEARCH_TIMEOUT_SECONDS: "${WEB_SEARCH_TIMEOUT_SECONDS:-45}"
      WEB_SEARCH_ALLOWED_DOMAINS: "${WEB_SEARCH_ALLOWED_DOMAINS:-[]}"
      COMPUTER_WORKSPACE_ENABLED: "${COMPUTER_WORKSPACE_ENABLED:-true}"
      COMPUTER_WORKSPACE_ROOTS: '${COMPUTER_WORKSPACE_ROOTS:-{"workspace":"/workspace"}}'
      COMPUTER_WORKSPACE_TENANT_ID: "${COMPUTER_WORKSPACE_TENANT_ID:-local}"
      COMPUTER_WORKSPACE_PROJECT_ID: "${COMPUTER_WORKSPACE_PROJECT_ID:-default}"
      COMPUTER_WORKSPACE_MAX_FILE_BYTES: "${COMPUTER_WORKSPACE_MAX_FILE_BYTES:-10000000}"
      COMPUTER_WORKSPACE_MAX_EXTRACTED_CHARS: "${COMPUTER_WORKSPACE_MAX_EXTRACTED_CHARS:-250000}"
      COMPUTER_WORKSPACE_MAX_PDF_PAGES: "${COMPUTER_WORKSPACE_MAX_PDF_PAGES:-100}"
      COMPUTER_WORKSPACE_MAX_SCAN_ENTRIES: "${COMPUTER_WORKSPACE_MAX_SCAN_ENTRIES:-5000}"
      COMPUTER_WORKSPACE_MAX_SEARCH_FILES: "${COMPUTER_WORKSPACE_MAX_SEARCH_FILES:-500}"
      POSTGRES_DSN: "postgresql://hermesgraph:${HERMESGRAPH_POSTGRES_PASSWORD:-hermesgraph-dev}@postgres:5432/hermesgraph"
      RETRIEVAL_BACKEND: qdrant
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-deterministic}"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-256}"
      EMBEDDING_BASE_URL: "${DOCKER_EMBEDDING_BASE_URL:-}"
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: "${QDRANT_COLLECTION:-hermesgraph_chunks}"
      QDRANT_SPARSE_IDF: "${QDRANT_SPARSE_IDF:-false}"
      QDRANT_SPARSE_ENCODER: "${QDRANT_SPARSE_ENCODER:-hashed}"
      QDRANT_BM25_K1: "${QDRANT_BM25_K1:-1.2}"
      QDRANT_BM25_B: "${QDRANT_BM25_B:-0.75}"
      QDRANT_BM25_AVERAGE_DOCUMENT_TOKENS: "${QDRANT_BM25_AVERAGE_DOCUMENT_TOKENS:-150}"
      AGENTIC_RETRIEVAL_ENABLED: "${AGENTIC_RETRIEVAL_ENABLED:-true}"
      RETRIEVAL_PLANNER_MODE: "${RETRIEVAL_PLANNER_MODE:-deterministic}"
      RETRIEVAL_PLANNER_MODEL: "${RETRIEVAL_PLANNER_MODEL:-gpt-5.6}"
      RETRIEVAL_PLANNER_MAX_OUTPUT_TOKENS: "${RETRIEVAL_PLANNER_MAX_OUTPUT_TOKENS:-1500}"
      RETRIEVAL_PLANNER_TIMEOUT_SECONDS: "${RETRIEVAL_PLANNER_TIMEOUT_SECONDS:-30}"
      RETRIEVAL_MAX_ROUNDS: "${RETRIEVAL_MAX_ROUNDS:-2}"
      RETRIEVAL_MAX_SUBQUERIES: "${RETRIEVAL_MAX_SUBQUERIES:-4}"
      GRAPH_BACKEND: neo4j
      GRAPH_EXTRACTOR_MODE: "${GRAPH_EXTRACTOR_MODE:-rule}"
      GRAPH_EXTRACTION_MODEL: "${GRAPH_EXTRACTION_MODEL:-gpt-5.6}"
      GRAPH_EXTRACTION_MAX_BATCH_CHARS: "${GRAPH_EXTRACTION_MAX_BATCH_CHARS:-60000}"
      GRAPH_EXTRACTION_WINDOW_MAX_CHARS: "${GRAPH_EXTRACTION_WINDOW_MAX_CHARS:-6000}"
      GRAPH_EXTRACTION_WINDOW_MAX_CHUNKS: "${GRAPH_EXTRACTION_WINDOW_MAX_CHUNKS:-4}"
      GRAPH_EXTRACTION_WINDOW_OVERLAP_CHUNKS: "${GRAPH_EXTRACTION_WINDOW_OVERLAP_CHUNKS:-1}"
      GRAPH_EXTRACTION_INPUT_CHAR_BUDGET: "${GRAPH_EXTRACTION_INPUT_CHAR_BUDGET:-20000}"
      GRAPH_EXTRACTION_PUBLIC_REFERENCE_CHAR_BUDGET: "${GRAPH_EXTRACTION_PUBLIC_REFERENCE_CHAR_BUDGET:-20000}"
      GRAPH_EXTRACTION_MAX_OUTPUT_TOKENS: "${GRAPH_EXTRACTION_MAX_OUTPUT_TOKENS:-4000}"
      GRAPH_EXTRACTION_TIMEOUT_SECONDS: "${GRAPH_EXTRACTION_TIMEOUT_SECONDS:-300}"
      GRAPH_EXTRACTION_MAX_ENTITIES: "${GRAPH_EXTRACTION_MAX_ENTITIES:-25}"
      GRAPH_EXTRACTION_MAX_RELATIONS: "${GRAPH_EXTRACTION_MAX_RELATIONS:-25}"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${HERMESGRAPH_NEO4J_PASSWORD:-hermesgraph-dev}"
      NEO4J_DATABASE: neo4j
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8000"
    volumes:
      - app_data:/data
      - ./workspace:/workspace:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  hermes:
    build:
      context: .
      dockerfile: deploy/hermes/Dockerfile
      args:
        HERMES_BASE_IMAGE: "${HERMES_BASE_IMAGE:-nikolaik/python-nodejs:python3.13-nodejs20-slim@sha256:ef37897d6366a5e510782b6f708106c5e4e447975036d898295542647c155d6b}"
        HERMES_AGENT_VERSION: "0.19.0"
        PIP_INDEX_URL: "${HERMES_PIP_INDEX_URL:-https://pypi.org/simple}"
    restart: unless-stopped
    environment:
      HERMES_HOME: /data/hermes
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      API_SERVER_KEY: "${HERMES_API_KEY:-hermesgraph-local-api-key-change-me-0001}"
      OPENAI_API_KEY: "${MODEL_API_KEY:-${OPENAI_API_KEY:-}}"
      HERMES_MODEL: "${OPENAI_MODEL:-gpt-5.6}"
      HERMES_MODEL_BASE_URL: "${DOCKER_MODEL_BASE_URL:-https://api.openai.com/v1}"
      HERMES_MODEL_API_MODE: "${HERMES_MODEL_API_MODE:-chat_completions}"
      HERMES_TERMINAL_BACKEND: "${HERMES_TERMINAL_BACKEND:-docker}"
      HERMESGRAPH_BRIDGE_URL: http://app:8000/internal/hermes
      HERMESGRAPH_BRIDGE_TOKEN: "${HERMES_BRIDGE_TOKEN:-hermesgraph-local-bridge-change-me-0001}"
      HERMESGRAPH_NATIVE_ADMIN_HOST: 0.0.0.0
      HERMESGRAPH_NATIVE_ADMIN_PORT: "8643"
      HERMESGRAPH_NATIVE_ADMIN_TOKEN: "${HERMES_NATIVE_ADMIN_TOKEN:-hermesgraph-local-native-admin-change-me-0001}"
      HERMESGRAPH_NATIVE_SNAPSHOT_MAX_BYTES: "${HERMES_NATIVE_SNAPSHOT_MAX_BYTES:-5000000}"
      HERMESGRAPH_NATIVE_SNAPSHOT_MAX_TOTAL_BYTES: "${HERMES_NATIVE_SNAPSHOT_MAX_TOTAL_BYTES:-1000000000}"
      HERMESGRAPH_NATIVE_SNAPSHOT_TERMINAL_RETENTION_DAYS: "${HERMES_NATIVE_SNAPSHOT_TERMINAL_RETENTION_DAYS:-7}"
      HERMESGRAPH_NATIVE_SNAPSHOT_NO_CHANGE_RETENTION_HOURS: "${HERMES_NATIVE_SNAPSHOT_NO_CHANGE_RETENTION_HOURS:-24}"
      HERMESGRAPH_GRAPH_ENABLED: "${GRAPH_BACKEND:-neo4j}"
      HERMESGRAPH_WEB_SEARCH_ENABLED: "${WEB_SEARCH_MODE:-disabled}"
      HERMESGRAPH_COMPUTER_ENABLED: "${COMPUTER_WORKSPACE_ENABLED:-true}"
      HERMESGRAPH_PERSONAL_ENABLED: "${HERMESGRAPH_PERSONAL_ENABLED:-true}"
    ports:
      - "127.0.0.1:${HERMES_PORT:-8642}:8642"
    volumes:
      - hermes_data:/data/hermes
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8642/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: hermesgraph
      POSTGRES_USER: hermesgraph
      POSTGRES_PASSWORD: "${HERMESGRAPH_POSTGRES_PASSWORD:-hermesgraph-dev}"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U hermesgraph -d hermesgraph
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  qdrant:
    image: qdrant/qdrant:v1.18.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:2026.06.0
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${HERMESGRAPH_NEO4J_PASSWORD:-hermesgraph-dev}"
      HERMESGRAPH_PASSWORD: "${HERMESGRAPH_NEO4J_PASSWORD:-hermesgraph-dev}"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -u neo4j -p "$${HERMESGRAPH_PASSWORD}"
          "RETURN 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  app_data:
  hermes_data:
  postgres_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
