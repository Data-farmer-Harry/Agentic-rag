<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">HermesGraph governed self-evolution loop</title>
  <desc id="desc">A governed learning flow from run trajectory to experience, pattern, evaluation, deployment and rollback.</desc>
  <style>
    .bg { fill: #f7f8f7; }
    .card { fill: #fff; stroke: #d9dedb; stroke-width: 2; }
    .green { fill: #e8f2ed; stroke: #83ad9b; stroke-width: 2; }
    .amber { fill: #fff8e8; stroke: #ddb868; stroke-width: 2; }
    .red { fill: #fcefeb; stroke: #d89885; stroke-width: 2; }
    .title { font: 700 28px Inter, Arial, sans-serif; fill: #17201c; }
    .step { font: 700 17px Inter, Arial, sans-serif; fill: #17201c; }
    .body { font: 400 14px Inter, Arial, sans-serif; fill: #52605a; }
    .index { font: 700 13px Inter, Arial, sans-serif; fill: #fff; }
    .line { stroke: #7f8b85; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .return { stroke: #c27660; stroke-width: 2.5; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowRed); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8b85"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c27660"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="600" rx="12"/>
  <text class="title" x="60" y="62">Governed self-evolution</text>
  <text class="body" x="60" y="91">The system learns from evidence and evaluation, never by silently appending every conversation to the prompt.</text>

  <rect class="card" x="55" y="165" width="200" height="150" rx="8"/>
  <circle cx="86" cy="194" r="15" fill="#173d31"/><text class="index" x="82" y="199">1</text>
  <text class="step" x="80" y="240">Run trajectory</text>
  <text class="body" x="80" y="270">Answer, evidence, tools,</text>
  <text class="body" x="80" y="293">feedback and outcome</text>

  <rect class="card" x="285" y="165" width="200" height="150" rx="8"/>
  <circle cx="316" cy="194" r="15" fill="#173d31"/><text class="index" x="312" y="199">2</text>
  <text class="step" x="310" y="240">Experience bank</text>
  <text class="body" x="310" y="270">Immutable E+ / E- cases</text>
  <text class="body" x="310" y="293">Scoped and auditable</text>

  <rect class="amber" x="515" y="165" width="200" height="150" rx="8"/>
  <circle cx="546" cy="194" r="15" fill="#b48222"/><text class="index" x="542" y="199">3</text>
  <text class="step" x="540" y="240">Pattern candidate</text>
  <text class="body" x="540" y="270">Repeated behavior becomes</text>
  <text class="body" x="540" y="293">a versioned draft</text>

  <rect class="green" x="745" y="165" width="200" height="150" rx="8"/>
  <circle cx="776" cy="194" r="15" fill="#34765d"/><text class="index" x="772" y="199">4</text>
  <text class="step" x="770" y="240">Evaluation gate</text>
  <text class="body" x="770" y="270">Safety, replay, quality</text>
  <text class="body" x="770" y="293">and promotion evidence</text>

  <rect class="green" x="975" y="165" width="200" height="150" rx="8"/>
  <circle cx="1006" cy="194" r="15" fill="#34765d"/><text class="index" x="1002" y="199">5</text>
  <text class="step" x="1000" y="240">Shadow / Canary</text>
  <text class="body" x="1000" y="270">Stable assignment and</text>
  <text class="body" x="1000" y="293">treatment/control health</text>

  <rect class="card" x="1205" y="165" width="180" height="150" rx="8"/>
  <circle cx="1236" cy="194" r="15" fill="#173d31"/><text class="index" x="1232" y="199">6</text>
  <text class="step" x="1230" y="240">Active version</text>
  <text class="body" x="1230" y="270">Pinned per run and</text>
  <text class="body" x="1230" y="293">bounded by policy</text>

  <path class="line" d="M255 240 H273"/><path class="line" d="M485 240 H503"/>
  <path class="line" d="M715 240 H733"/><path class="line" d="M945 240 H963"/>
  <path class="line" d="M1175 240 H1193"/>

  <rect class="red" x="815" y="415" width="350" height="105" rx="8"/>
  <text class="step" x="845" y="456">Health regression</text>
  <text class="body" x="845" y="486">Append-only decision and automatic rollback</text>
  <path class="return" d="M1295 315 V367 H1100 V403"/>
  <path class="return" d="M815 468 H615 V327"/>

  <rect class="card" x="275" y="415" width="420" height="105" rx="8"/>
  <text class="step" x="305" y="456">Human review remains authoritative</text>
  <text class="body" x="305" y="486">High-impact memory, skill and graph facts retain explicit governance.</text>
</svg>
